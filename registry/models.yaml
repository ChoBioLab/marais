models:

  - id: qwen27-fp8
    hf: Qwen/Qwen3.8-27B-FP8
    slug: Qwen--Qwen3.8-27B-FP8
    format: fp8
    weights_gb: 29
    served: qwen27
    parser: qwen3_coder
    ctx: 131072
    min_gpus: 1
    gpus_ok: [a10080g, h100nvl, h10080g, b200]
    vllm_extra: "--max-num-seqs 256  --reasoning-parser qwen3"

  - id: qwen27-bf16
    hf: Qwen/Qwen3.8-27B
    slug: Qwen--Qwen3.8-27B
    format: bf16
    weights_gb: 56
    served: qwen27-bf16          # must differ from qwen27-fp8: job names key on it
    parser: qwen3_coder
    ctx: 262144
    min_gpus: 2
    gpus_ok: [a10080g, h100nvl, h10080g, b200]
    vllm_extra: "--max-num-seqs 256  --reasoning-parser qwen3"

  - id: flashnext-fp8
    hf: Qwen/Qwen3.8-FlashNext-125B-FP8
    slug: Qwen--Qwen3.8-FlashNext-125B-FP8
    format: fp8
    weights_gb: 125
    served: flashnext
    parser: hermes
    ctx: 262144
    min_gpus: 2
    gpus_ok: [h100nvl, a10080g, b200]     # 125 GB will not fit an L40S row
    vllm_extra: "--max-num-seqs 256"      # precaution; remove if this model is not hybrid

  - id: embed-bge
    hf: BAAI/bge-m3
    slug: BAAI--bge-m3            # stage.sh.in adds the "models--" prefix itself
    format: bf16
    weights_gb: 2
    served: embed
    parser: none
    ctx: 8192
    min_gpus: 0
    gpus_ok: [cpu]

