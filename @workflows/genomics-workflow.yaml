name: genomics-analysis-workflow
steps:
  - id: literature
    agent: @agents/literature
    args:
      query: "CRISPR knockout TP53"
  - id: design
    agent: @agents/designer
    args:
      prompt: "Design a CRISPR screen for TP53 with 4 replicates and batch randomization."
  - id: analysis
    agent: @agents/analyst
    args:
      task: "Run bulk RNA‑seq differential expression using provided FASTQ files."
  - id: review
    agent: @agents/designer
    args:
      prompt: "Review the analysis results and suggest any improvements."
